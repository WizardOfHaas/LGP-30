name: deploy-web
on:
  push:
    branches:
      - main
jobs:
  build-emulator:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - run: cp ./src/public/test.html /var/www/html/index.html
      - run: cp -r ./dist /var/www/html/